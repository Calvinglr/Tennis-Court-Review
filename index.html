<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis court review</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f4;color:#1c1917}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #d6d3d1;padding:10px 16px;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #a8a29e;background:#fff;border-radius:6px;padding:6px 12px;font-size:14px}
button.on{background:#1c1917;color:#fff}
.yes.on{background:#15803d}.no.on{background:#b91c1c}.unsure.on{background:#a16207}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;padding:14px}
.card{background:#fff;border:1px solid #d6d3d1;border-radius:10px;overflow:hidden}
.card img{width:100%;display:block}.noimg{padding:60px;text-align:center;color:#78716c}
.b{padding:10px 12px;font-size:14px}.b h3{margin:0 0 4px;font-size:16px}
.m{color:#57534e;font-size:13px;margin:2px 0}.row{display:flex;gap:6px;margin-top:8px}
.done{opacity:.55}
</style></head><body>
<header>
 <button id="t-queue" onclick="setTab('queue')">Review queue</button>
 <button id="t-audit" onclick="setTab('audit')">Audit sample</button>
 <label><input type="checkbox" id="hide" onchange="render()"> hide decided</label>
 <span id="stat"></span>
 <button onclick="exportCsv()">Export decisions.csv</button>
</header>

const KEY='tennis-review-v1';
let dec={};try{dec=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let tab='queue';
function save(){try{localStorage.setItem(KEY,JSON.stringify(dec))}catch(e){}}
function setTab(t){tab=t;render()}
function pick(n,v){dec[n]=dec[n]===v?undefined:v;save();render()}
function render(){
 const hide=document.getElementById('hide').checked;
 document.getElementById('t-queue').className=tab==='queue'?'on':'';
 document.getElementById('t-audit').className=tab==='audit'?'on':'';
 const list=ITEMS.filter(i=>i.group===tab);
 const decided=list.filter(i=>dec[i.name]).length;
 let s=decided+'/'+list.length+' decided';
 if(tab==='audit'&&decided){
  const agree=list.filter(i=>dec[i.name]&&dec[i.name]===i.agent).length;
  s+=' | agent agreed with you on '+agree+'/'+decided+' ('+Math.round(100*agree/decided)+'%)';
 }
 document.getElementById('stat').textContent=s;
 const g=document.getElementById('grid');g.innerHTML='';
 for(const i of list){
  if(hide&&dec[i.name])continue;
  const c=document.createElement('div');c.className='card'+(dec[i.name]?' done':'');
  const sat='https://www.google.com/maps/@'+i.lat+','+i.lon+',19z/data=!3m1!1e3';
  const img=i.img?'<img src="data:image/jpeg;base64,'+i.img+'">':'<div class="noimg"><a target="_blank" href="'+sat+'">Open satellite view in Google Maps</a></div>';
  const btn=v=>'<button class="'+v+(dec[i.name]===v?' on':'')+'" onclick="pick('+JSON.stringify(i.name).replace(/"/g,'&quot;')+',\''+v+'\')">'+({yes:'Has tennis court',no:'No court',unsure:'Can\'t tell'})[v]+'</button>';
  c.innerHTML=img+'<div class="b"><h3>'+esc(i.name)+'</h3>'
   +'<div class="m">Agent: <b>'+i.agent+'</b> &middot; '+esc(i.reason)+(i.rule?' &middot; rule: '+esc(i.rule):'')+'</div>'
   +'<div class="m">'+esc(i.evidence||'')+'</div>'
   +'<div class="m">Matched as: '+esc(i.matched_as||'')+(i.osm_dist_m!=null?' &middot; OSM court '+i.osm_dist_m+' m away':'')+'</div>'
   +'<div class="m"><a target="_blank" href="'+sat+'">Open satellite view</a></div>'
   +'<div class="row">'+btn('yes')+btn('no')+btn('unsure')+'</div></div>';
  g.appendChild(c);
 }
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m])}
function exportCsv(){
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=['project_name,human,group,agent'];
 for(const i of ITEMS)if(dec[i.name])rows.push([q(i.name),dec[i.name],i.group,i.agent].join(','));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
 a.download='decisions.csv';a.click();
}
render();
